stages:
  - build
  - test
  - push
  - deploy

# Docker global config
image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend
  IMAGE_CSHARP: $CI_REGISTRY_IMAGE/backend-csharp
  IMAGE_JAVA: $CI_REGISTRY_IMAGE/backend-java
  IMAGE_NODE: $CI_REGISTRY_IMAGE/backend-node
  # Prevent shell profile issues on WSL executor
  BASH_ENV: ""
  CI: "true"

# Global cache configuration
cache:
  paths:
    - node_modules/
    - student-project/backend-nodejs/node_modules/
    - student-project/backend-springboot/.m2/

# ─────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────

build:frontend:
  stage: build
  image: node:20
  script:
    - echo "Building Frontend..."
    - cd student-project/frontend-nextjs
    - npm install
    - npm run build

build:csharp:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:7.0
  script:
    - echo "Building C# backend..."
    - cd student-project/backend-csharp/StudentApi
    - dotnet restore
    - dotnet build -c Release
    - dotnet publish -c Release -o ./publish
  artifacts:
    paths:
      - student-project/backend-csharp/StudentApi/publish/
    expire_in: 1 week
    when: on_success

build:springboot:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Building Java backend..."
    - cd student-project/backend-springboot
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - student-project/backend-springboot/target/
    expire_in: 1 week
    when: on_success

build:node:
  stage: build
  image: node:20
  script:
    - echo "Building Node.js backend..."
    - cd student-project/backend-nodejs
    - npm install
    - npm run build || true
  artifacts:
    paths:
      - student-project/backend-nodejs/dist/
    expire_in: 1 week
    when: on_success

# ─────────────────────────────────────────
# TEST
# ─────────────────────────────────────────

test:frontend:
  stage: test
  image: node:20
  script:
    - echo "Testing frontend..."
    - cd student-project/frontend-nextjs
    - npm install
    - npm run lint || true

test:springboot:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running Java tests..."
    - cd student-project/backend-springboot
    - mvn test

# ─────────────────────────────────────────
# PUSH (Docker images)
# ─────────────────────────────────────────

push:frontend:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Login to GitLab registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building & pushing frontend image..."
    - docker build -t $IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA student-project/frontend-nextjs
    - docker build -t $IMAGE_FRONTEND:latest student-project/frontend-nextjs
    - docker push $IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_FRONTEND:latest

push:csharp:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Login to GitLab registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building & pushing C# image..."
    - docker build -t $IMAGE_CSHARP:$CI_COMMIT_SHORT_SHA student-project/backend-csharp/StudentApi
    - docker build -t $IMAGE_CSHARP:latest student-project/backend-csharp/StudentApi
    - docker push $IMAGE_CSHARP:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_CSHARP:latest

push:java:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Login to GitLab registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building & pushing Java image..."
    - docker build -t $IMAGE_JAVA:$CI_COMMIT_SHORT_SHA student-project/backend-springboot
    - docker build -t $IMAGE_JAVA:latest student-project/backend-springboot
    - docker push $IMAGE_JAVA:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_JAVA:latest

push:node:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - echo "Login to GitLab registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Building & pushing Node image..."
    - docker build -t $IMAGE_NODE:$CI_COMMIT_SHORT_SHA student-project/backend-nodejs
    - docker build -t $IMAGE_NODE:latest student-project/backend-nodejs
    - docker push $IMAGE_NODE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NODE:latest

# ─────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────

# Deploy DEV environment (Docker Compose)
deploy:dev:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Deploying to DEV using Docker Compose..."
    - docker-compose -f docker-compose.yml up -d
    - echo "Waiting for services to be healthy..."
    - sleep 10
    - docker-compose ps
    - echo "DEV deployment completed successfully"
  only:
    - develop
  when: manual
  environment:
    name: development
    url: http://localhost:3000

# Deploy UAT environment (Kubernetes)
deploy:uat:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to UAT (Kubernetes)..."
    - kubectl config current-context
    - kubectl create namespace student-management --dry-run=client -o yaml | kubectl apply -f -
    - echo "Applying Kubernetes Secrets and ConfigMaps..."
    - kubectl apply -f k8s/secrets.yaml
    - kubectl apply -f k8s/mysql-configmap.yaml
    - echo "Applying NetworkPolicy for security..."
    - kubectl apply -f k8s/network-policy.yaml
    - echo "Applying core infrastructure..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/mysql-statefulset.yaml
    - echo "Applying backend services..."
    - kubectl apply -f k8s/backend-csharp.yaml
    - kubectl apply -f k8s/backend-java.yaml
    - kubectl apply -f k8s/backend-node.yaml
    - echo "Applying frontend service..."
    - kubectl apply -f k8s/frontend.yaml
    - echo "Waiting for deployments to be ready..."
    - kubectl rollout status deployment/frontend -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-csharp -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-java -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-node -n student-management --timeout=5m
    - echo "UAT deployment completed successfully"
    - kubectl get pods -n student-management
  only:
    - main
  when: manual
  environment:
    name: staging
    kubernetes:
      namespace: student-management

# Deploy PRD environment (Kubernetes)
deploy:prd:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to PRD (Kubernetes)..."
    - kubectl config current-context
    - kubectl create namespace student-management --dry-run=client -o yaml | kubectl apply -f -
    - echo "Applying production Kubernetes Secrets and ConfigMaps..."
    - kubectl apply -f k8s/secrets.yaml
    - kubectl apply -f k8s/mysql-configmap.yaml
    - echo "Applying NetworkPolicy for security..."
    - kubectl apply -f k8s/network-policy.yaml
    - echo "Applying core infrastructure..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/mysql-statefulset.yaml
    - echo "Applying backend services..."
    - kubectl apply -f k8s/backend-csharp.yaml
    - kubectl apply -f k8s/backend-java.yaml
    - kubectl apply -f k8s/backend-node.yaml
    - echo "Applying frontend service..."
    - kubectl apply -f k8s/frontend.yaml
    - echo "Performing rolling update..."
    - kubectl rollout status deployment/frontend -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-csharp -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-java -n student-management --timeout=5m
    - kubectl rollout status deployment/backend-node -n student-management --timeout=5m
    - echo "Production deployment completed successfully"
    - kubectl get pods -n student-management
  only:
    - main
  when: manual
  environment:
    name: production
    kubernetes:
      namespace: student-management