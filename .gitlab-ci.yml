# ==============================================================================
# .gitlab-ci.yml — Student Management Micro-services
# Author : Group Project — EFREI 2025-2026
# Description : Full CI/CD pipeline — Build, Test, Push, Deploy
#               Multi-environment : DEV | UAT | PRD
#
# Real folder structure :
#   student-project/frontend-nextjs/          → Next.js frontend  (needs Node 20+)
#   student-project/backend-csharp/StudentApi → C# ASP.NET Core
#   student-project/backend-springboot/       → Java Spring Boot
#   student-project/backend-nodejs/           → Node.js Express
# ==============================================================================

variables:
  IMAGE_FRONTEND:   "$CI_REGISTRY_IMAGE/frontend"
  IMAGE_DOTNET:     "$CI_REGISTRY_IMAGE/backend-dotnet"
  IMAGE_SPRINGBOOT: "$CI_REGISTRY_IMAGE/backend-springboot"
  IMAGE_NODE:       "$CI_REGISTRY_IMAGE/backend-node"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  TAG: $CI_COMMIT_REF_SLUG

stages:
  - build
  - test
  - push
  - deploy

# ==============================================================================
# STAGE 1 — BUILD
# ==============================================================================

# ------------------------------------------------------------------------------
# Frontend — Next.js 16 requires Node >= 20.9.0
# ------------------------------------------------------------------------------
build:frontend:
  stage: build
  image: node:20-alpine
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  script:
    - echo "==> Installing dependencies for frontend (Node 20)"
    - cd student-project/frontend-nextjs
    - npm install
    - echo "==> Building Next.js production bundle"
    - npm run build
  artifacts:
    paths:
      - student-project/frontend-nextjs/.next/
      - student-project/frontend-nextjs/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------------------------
# C# — ASP.NET Core 7
# ------------------------------------------------------------------------------
build:dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:7.0
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  script:
    - echo "==> Restoring NuGet packages"
    - cd student-project/backend-csharp/StudentApi
    - dotnet restore
    - echo "==> Building C# project in Release mode"
    - dotnet build --configuration Release --no-restore
    - echo "==> Publishing C# project"
    - dotnet publish --configuration Release --no-build --output ./publish
  artifacts:
    paths:
      - student-project/backend-csharp/StudentApi/publish/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------------------------
# Java — Spring Boot 3.1 / Maven
# ------------------------------------------------------------------------------
build:springboot:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  script:
    - echo "==> Building Spring Boot project with Maven"
    - cd student-project/backend-springboot
    - mvn clean package -DskipTests --batch-mode
  artifacts:
    paths:
      - student-project/backend-springboot/target/*.jar
    expire_in: 1 hour
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - student-project/backend-springboot/.m2/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------------------------
# Node.js — package-lock.json out of sync → use npm install instead of npm ci
# ------------------------------------------------------------------------------
build:node:
  stage: build
  image: node:20-alpine
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  script:
    - echo "==> Installing dependencies for Node.js backend"
    - cd student-project/backend-nodejs
    - npm install
    - echo "==> Node.js backend ready"
  artifacts:
    paths:
      - student-project/backend-nodejs/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# STAGE 2 — TEST
# ==============================================================================

test:frontend:
  stage: test
  image: node:20-alpine
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["build:frontend"]
  script:
    - echo "==> Running ESLint on frontend code"
    - cd student-project/frontend-nextjs
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

test:springboot:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["build:springboot"]
  script:
    - echo "==> Running JUnit tests for Spring Boot"
    - cd student-project/backend-springboot
    - mvn test --batch-mode
  artifacts:
    reports:
      junit: student-project/backend-springboot/target/surefire-reports/TEST-*.xml
    paths:
      - student-project/backend-springboot/target/surefire-reports/
    expire_in: 7 days
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - student-project/backend-springboot/.m2/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

test:node:
  stage: test
  image: node:20-alpine
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["build:node"]
  script:
    - echo "==> Running Node.js tests"
    - cd student-project/backend-nodejs
    - npm test --if-present
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# STAGE 3 — PUSH
# Build Docker images and push to GitLab Container Registry
# ==============================================================================

push:frontend:
  stage: push
  image: docker:24
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  needs: ["build:frontend", "test:frontend"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --cache-from "$IMAGE_FRONTEND:latest" --tag "$IMAGE_FRONTEND:$TAG" --tag "$IMAGE_FRONTEND:latest" ./student-project/frontend-nextjs
    - docker push "$IMAGE_FRONTEND:$TAG"
    - docker push "$IMAGE_FRONTEND:latest"
  after_script:
    - docker logout $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

push:dotnet:
  stage: push
  image: docker:24
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  needs: ["build:dotnet"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --cache-from "$IMAGE_DOTNET:latest" --tag "$IMAGE_DOTNET:$TAG" --tag "$IMAGE_DOTNET:latest" ./student-project/backend-csharp/StudentApi
    - docker push "$IMAGE_DOTNET:$TAG"
    - docker push "$IMAGE_DOTNET:latest"
  after_script:
    - docker logout $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

push:springboot:
  stage: push
  image: docker:24
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  needs: ["build:springboot", "test:springboot"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --cache-from "$IMAGE_SPRINGBOOT:latest" --tag "$IMAGE_SPRINGBOOT:$TAG" --tag "$IMAGE_SPRINGBOOT:latest" ./student-project/backend-springboot
    - docker push "$IMAGE_SPRINGBOOT:$TAG"
    - docker push "$IMAGE_SPRINGBOOT:latest"
  after_script:
    - docker logout $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

push:node:
  stage: push
  image: docker:24
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  needs: ["build:node", "test:node"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --cache-from "$IMAGE_NODE:latest" --tag "$IMAGE_NODE:$TAG" --tag "$IMAGE_NODE:latest" ./student-project/backend-nodejs
    - docker push "$IMAGE_NODE:$TAG"
    - docker push "$IMAGE_NODE:latest"
  after_script:
    - docker logout $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# STAGE 4 — DEPLOY
#
# Port convention (cahier des charges +10/+20) :
#   PRD : frontend=3000 | node=4000 | dotnet=5000 | java=8080
#   UAT : frontend=3010 | node=4010 | dotnet=5010 | java=8090
#   DEV : frontend=3020 | node=4020 | dotnet=5020 | java=8100
# ==============================================================================

deploy:dev:
  stage: deploy
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["push:frontend", "push:dotnet", "push:springboot", "push:node"]
  environment:
    name: development
    url: http://localhost:3020
  script:
    - echo "==> Deploying to DEV (frontend:3020 | node:4020 | dotnet:5020 | java:8100)"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
    - docker-compose -f docker-compose.dev.yml pull
    - docker-compose -f docker-compose.dev.yml up -d --force-recreate --remove-orphans
    - echo "==> DEV deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:uat:
  stage: deploy
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["push:frontend", "push:dotnet", "push:springboot", "push:node"]
  environment:
    name: uat
    url: http://localhost:3010
  script:
    - echo "==> Deploying to UAT (frontend:3010 | node:4010 | dotnet:5010 | java:8090)"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
    - docker-compose -f docker-compose.uat.yml pull
    - docker-compose -f docker-compose.uat.yml up -d --force-recreate --remove-orphans
    - echo "==> UAT deployment complete"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:prd:docker-compose:
  stage: deploy
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["push:frontend", "push:dotnet", "push:springboot", "push:node"]
  environment:
    name: production
    url: http://localhost:3000
  script:
    - echo "==> Deploying to PRODUCTION via Docker Compose"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
    - docker-compose -f docker-compose.yml pull
    - docker-compose -f docker-compose.yml up -d --force-recreate --remove-orphans
    - sleep 20
    - curl --fail --silent --max-time 10 http://localhost:3000 || (echo "ERROR frontend" && exit 1)
    - curl --fail --silent --max-time 10 http://localhost:5000/api/students || (echo "ERROR dotnet" && exit 1)
    - curl --fail --silent --max-time 10 http://localhost:8080/api/students || (echo "ERROR java" && exit 1)
    - curl --fail --silent --max-time 10 http://localhost:4000/api/students || (echo "ERROR node" && exit 1)
    - echo "==> All health checks passed — PRD is live!"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:prd:minikube:
  stage: deploy
  tags:
    - linux
    - docker
    - shell
    - efrei_project
  needs: ["push:frontend", "push:dotnet", "push:springboot", "push:node"]
  environment:
    name: production-k8s
    url: http://localhost:3000
  variables:
    NAMESPACE: "student-management"
  script:
    - echo "==> Applying Kubernetes manifests to Minikube"
    - sed -i "s|IMAGE_FRONTEND|$IMAGE_FRONTEND:$TAG|g" kubernetes/manifest.yaml
    - sed -i "s|IMAGE_DOTNET|$IMAGE_DOTNET:$TAG|g" kubernetes/manifest.yaml
    - sed -i "s|IMAGE_SPRINGBOOT|$IMAGE_SPRINGBOOT:$TAG|g" kubernetes/manifest.yaml
    - sed -i "s|IMAGE_NODE|$IMAGE_NODE:$TAG|g" kubernetes/manifest.yaml
    - kubectl apply -f kubernetes/manifest.yaml
    - kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/backend-dotnet -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/backend-springboot -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/backend-node -n $NAMESPACE --timeout=120s
    - kubectl get pods -n $NAMESPACE
    - echo "==> Kubernetes deployment complete!"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'