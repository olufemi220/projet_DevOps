name: Global Project Verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
      - name: Build
        run: dotnet build ./student-project/backend-csharp/StudentApi/StudentApi.csproj -c Release

  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Correction : passage à Node 20
      - name: Install & Build
        working-directory: ./student-project/frontend-nextjs
        run: |
          npm install
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          # On vérifie le contexte : on se met dans le dossier où est le Dockerfile
          context: ./student-project/backend-csharp/StudentApi
          push: false
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./student-project/frontend-nextjs
          push: false

  kubernetes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate YAML
        # Correction : utilisation d'un script qui accepte le multi-document (---)
        run: |
          python3 -c "import yaml; [list(yaml.safe_load_all(open(f))) for f in ['k8s/backend-deployment.yaml', 'k8s/frontend-deployment.yaml', 'k8s/efrei-ingress.yaml', 'k8s/mysql-deployment.yaml']]"