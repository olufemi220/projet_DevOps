---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: student-management
type: Opaque
stringData:
  username: root
  password: root_secure_password_2025
  root-password: root_secure_password_2025

---
# Backend Connection Strings Secret
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: student-management
type: Opaque
stringData:
  # C# Backend connection string
  CSHARP_CONNECTION_STRING: "Server=mysql;Database=StudentManagement_PRD;User Id=root;Password=root_secure_password_2025;Port=3306;Allow User Variables=true;"
  
  # Java Backend datasource
  JAVA_DATASOURCE_URL: "jdbc:mysql://mysql:3306/StudentManagement_PRD?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  JAVA_DATASOURCE_USERNAME: "root"
  JAVA_DATASOURCE_PASSWORD: "root_secure_password_2025"
  
  # Node.js Backend database URL
  NODE_DATABASE_URL: "mysql://root:root_secure_password_2025@mysql:3306/StudentManagement_PRD"

---
# Frontend API Configuration Secret
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: student-management
type: Opaque
stringData:
  # Internal API URLs for inter-service communication
  CSHARP_API_INTERNAL: "http://backend-csharp:5000"
  JAVA_API_INTERNAL: "http://backend-java:8080"
  NODE_API_INTERNAL: "http://backend-node:4000"
