apiVersion: v1
kind: Secret
metadata:
  name: student-api-secrets
  namespace: student-management
type: Opaque
stringData:
  # Database credentials (base64 encoded in production)
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: student_user
  DB_PASSWORD: student_password123
  DB_NAME: StudentManagement_Prd
  
  # API Configuration
  CORS_ORIGIN: "*"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX: "100"
  
  # C# Backend
  ASPNETCORE_ENVIRONMENT: Production
  
  # Java Backend
  SPRING_PROFILE: prod
  
  # Node.js Backend
  NODE_ENV: production
  LOG_LEVEL: info

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: student-management
type: Opaque
stringData:
  # MySQL root user credentials (change in production!)
  MYSQL_ROOT_PASSWORD: secureRootPassword123!
  MYSQL_DATABASE: StudentManagement_Prd
  MYSQL_USER: student_user
  MYSQL_PASSWORD: secureStudentPassword456!

---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: student-management
type: kubernetes.io/dockercfg
data:
  # Docker registry credentials (base64 encoded)
  # Create using: kubectl create secret docker-registry registry-credentials ...
